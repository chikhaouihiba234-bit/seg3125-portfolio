<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design 4: Analytics Dashboard | Hiba Chikhaoui</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    .coming-page {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      background: var(--cream);
    }
    .coming-thumb {
      width: 80px; height: 80px;
      background: #ede9fe;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem; font-size: 2rem;
    }
    .coming-tag {
      font-size: 0.8rem; color: var(--green); font-weight: 600;
      border: 1px solid var(--green); padding: 3px 12px;
      border-radius: 999px; display: inline-block; margin-bottom: 1rem;
    }
    .coming-title {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem; font-weight: 400;
      color: var(--dark); margin-bottom: 0.75rem;
    }
    .coming-desc {
      color: var(--gray); max-width: 400px;
      margin: 0 auto 2rem; line-height: 1.65; font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <nav class="navbar sticky-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="index.html">HC</a>
    </div>
  </nav>
  <div class="coming-page">
    <div class="coming-thumb">📊</div>
    <span class="coming-tag">Design 4: Analytics</span>
    <h1 class="coming-title">Coming Soon</h1>
    <p class="coming-desc">A data analytics dashboard with charts and visualizations. Coming later this semester!</p>
    <a href="index.html" class="btn-teal">← Back to portfolio</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
